; XCall — local dev server php.ini (used with: php -c local\php.ini -S ...)
; Extensions are loaded relative to this ini's directory.

extension_dir = "ext"

extension=curl
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3

display_errors = On
log_errors = On
error_reporting = E_ALL
date.timezone = UTC

; built-in server + CLI defaults
session.use_cookies = 1
