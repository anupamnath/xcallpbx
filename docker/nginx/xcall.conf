# XCall — nginx reverse proxy.
#
# Serves the XCall portal over TLS, proxies the verto WebSocket (WSS) for the
# in-browser softphone, and exposes the FreeSWITCH ESL port to the AI agent.
#
# For a public deployment, replace the self-signed cert block with ACME
# (certbot / caddy). For LAN, keep the self-signed cert (install the CA once
# on clients, or accept the browser warning once per host).

upstream portal_upstream {
    server portal:80;
}

upstream verto_upstream {
    server freeswitch:8082;   # verto secure (wss) inside the docker net
}

# --- security limits ---
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api:10m  rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server {
    listen 80;
    server_name _;

    # redirect to https (skip for LAN dev if you prefer plain http)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/wss.pem;
    ssl_certificate_key /etc/nginx/certs/wss.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- security headers ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- performance ---
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 8m;
    limit_conn conn 20;

    # --- portal (rate-limited login; everything else proxied) ---
    location /login.php {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://portal_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://portal_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- AI assistant API (rate-limited, small JSON) ---
    location /ai-assistant/assistant_api.php {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://portal_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- verto websocket (web softphone) ---
    location /verto {
        proxy_pass http://verto_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # --- static cache headers ---
    location ~* \.(css|js|svg|png|jpg|ico)$ {
        proxy_pass http://portal_upstream;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }
}

# ESL for the AI agent when it runs outside the docker network:
# expose 8021 on the host and point the agent's ESL_HOST at it.

