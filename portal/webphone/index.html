<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XCall Softphone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="phone">

  <header class="phone-header">
    <div class="brand">
      <span class="brand-mark">X</span>
      <span class="brand-name">XCall</span>
    </div>
    <div class="status" id="status">Loading…</div>
  </header>

  <!-- Registrar (ViciBox-style): account + registration state + manual setup -->
  <section class="registrar" id="registrarPanel">
    <div class="reg-details">
      <div class="reg-detail">
        <span class="reg-label">Extension</span>
        <span class="reg-value" id="regExtension">—</span>
      </div>
      <div class="reg-detail">
        <span class="reg-label">Server</span>
        <span class="reg-value" id="regServer">—</span>
      </div>
    </div>

    <div class="reg-status">
      <span class="reg-dot" id="regDot"></span>
      <span id="regState">Offline</span>
      <span class="reg-reason hidden" id="regReason"></span>
    </div>

    <div class="reg-actions">
      <button id="retryBtn" class="btn btn-sm btn-ghost">&#8635; Retry</button>
      <button id="manualToggle" class="btn btn-sm btn-ghost">Manual setup</button>
    </div>

    <form id="manualForm" class="manual hidden" autocomplete="off">
      <input id="mExt" type="text" placeholder="Extension" autocomplete="off">
      <input id="mPass" type="password" placeholder="SIP password" autocomplete="off">
      <input id="mDomain" type="text" placeholder="Domain (e.g. pbx.example.com)" autocomplete="off">
      <input id="mWs" type="text" placeholder="WSS server (e.g. wss://pbx.example.com/verto)" autocomplete="off">
      <button type="submit" class="btn btn-sm btn-primary btn-block">Register</button>
      <button type="button" id="mUsePortal" class="btn btn-sm btn-ghost btn-block">Use portal account</button>
    </form>

    <div class="auth-notice hidden" id="authNotice">
      You are not logged in to the XCall portal.
      <a href="login.php" target="_blank" rel="noopener">Log in</a> to register your portal
      extension, or open <button type="button" id="authManual" class="linklike">manual setup</button>.
    </div>
  </section>

  <section class="caller" id="callerPanel">
    <div class="caller-name" id="callerName">—</div>
    <div class="caller-number" id="callerNumber">—</div>
    <div class="caller-duration" id="callDuration">00:00</div>
  </section>

  <section class="dialpad" id="dialpad">
    <input id="numberInput" type="tel" autocomplete="off"
           placeholder="Enter extension or number" enterkeyhint="call" disabled>
    <div class="keys">
      <button class="key" data-d="1">1</button>
      <button class="key" data-d="2">2</button>
      <button class="key" data-d="3">3</button>
      <button class="key" data-d="4">4</button>
      <button class="key" data-d="5">5</button>
      <button class="key" data-d="6">6</button>
      <button class="key" data-d="7">7</button>
      <button class="key" data-d="8">8</button>
      <button class="key" data-d="9">9</button>
      <button class="key" data-d="*">*</button>
      <button class="key" data-d="0">0</button>
      <button class="key" data-d="#">#</button>
    </div>
  </section>

  <section class="controls" id="controls">
    <button id="callBtn" class="btn btn-call" title="Make a call">&#128222;</button>
    <button id="hangupBtn" class="btn btn-hangup hidden" title="Hang up">&#128263;</button>
    <button id="muteBtn" class="btn btn-mute" title="Mute">&#128263;</button>
    <button id="holdBtn" class="btn btn-hold" title="Hold / Resume">&#9199;</button>
  </section>

  <section class="log" id="logPanel">
    <div id="log"></div>
  </section>
</div>

<script src="vendor/sip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
